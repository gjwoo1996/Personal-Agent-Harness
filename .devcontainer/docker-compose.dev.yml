volumes:
  pah-claude-config:
  pah-codex-config:

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:?Set CLAUDE_CODE_VERSION in .devcontainer/.env}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .devcontainer/.env}
    volumes:
      - ..:${containerWorkspaceFolder}:cached
      - pah-claude-config:/home/vscode/.claude
      - pah-codex-config:/home/vscode/.codex
    command: sleep infinity
